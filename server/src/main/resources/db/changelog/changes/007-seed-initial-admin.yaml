databaseChangeLog:
  - changeSet:
      id: 007-seed-initial-admin
      author: Animesh Kahara
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: user_id
                  value: 00000000-0000-0000-0000-000000000001
              - column:
                  name: username
                  value: admin
              - column:
                  name: email
                  value: admin@example.com
              - column:
                  name: password_hash
                  value: $2a$10$K49f0.U50RY3z.GoidSc6e7bU3JjMlpBm28RlHkbfWL4GDllqD5vW
