databaseChangeLog:
  - changeSet:
      id: 005-add-user-role
      author: Animesh Kahara
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: role
                  type: VARCHAR(16)
                  defaultValue: USER
                  constraints:
                    nullable: false
        - createIndex:
            tableName: users
            indexName: idx_users_role
            columns:
              - column:
                  name: role