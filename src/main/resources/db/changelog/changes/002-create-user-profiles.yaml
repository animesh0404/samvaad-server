databaseChangeLog:
  - changeSet:
      id: 002-create-user-profiles
      author: Animesh Kahara
      changes:
        - createTable:
            tableName: user_profiles
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: display_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: bio
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: avatar_url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: true
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: middle_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: status_message
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_profiles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_user_profiles_user
