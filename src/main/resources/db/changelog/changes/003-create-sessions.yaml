databaseChangeLog:
  - changeSet:
      id: 003-create-sessions
      author: Animesh Kahara
      changes:
        - createTable:
            tableName: sessions
            columns:
              - column:
                  name: session_id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: refresh_token_hash
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: refresh_token_expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: installation_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: client_platform
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: client_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: client_version
                  type: VARCHAR(64)
                  constraints:
                    nullable: true
              - column:
                  name: last_seen_ip
                  type: VARCHAR(45)
                  constraints:
                    nullable: true
              - column:
                  name: last_seen_user_agent
                  type: VARCHAR(512)
                  constraints:
                    nullable: true
              - column:
                  name: last_authenticated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: revocation_reason
                  type: VARCHAR(32)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: sessions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_sessions_user
        - createIndex:
            tableName: sessions
            indexName: idx_sessions_user_active
            columns:
              - column:
                  name: user_id
              - column:
                  name: revoked_at
              - column:
                  name: refresh_token_expires_at
