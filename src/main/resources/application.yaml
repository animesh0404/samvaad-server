spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/samvaad
    username: samvaad
    password: samvaad

  jpa:
    hibernate:
      ddl-auto: validate

samvaad:
  auth:
    jwt-secret: ${SAMVAAD_JWT_SECRET}
  bootstrap:
    admin:
      username: ${SAMVAAD_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${SAMVAAD_BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${SAMVAAD_BOOTSTRAP_ADMIN_EMAIL:}