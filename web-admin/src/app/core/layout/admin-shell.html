<div class="min-h-screen bg-slate-100 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-4 px-4 py-3">
      <a routerLink="/" class="flex items-center gap-2 text-lg font-semibold tracking-tight"
        ><img src="logo.png" alt="Samvaad logo" class="h-8 w-8" />Samvaad Admin</a
      >
      <nav aria-label="Admin sections" class="flex items-center gap-1 text-sm">
        <a
          routerLink="/"
          routerLinkActive="bg-slate-900 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded px-3 py-1.5 hover:bg-slate-200"
          >Dashboard</a
        >
        <a
          routerLink="/users"
          routerLinkActive="bg-slate-900 text-white"
          class="rounded px-3 py-1.5 hover:bg-slate-200"
          >Users</a
        >
        <a
          routerLink="/profile"
          routerLinkActive="bg-slate-900 text-white"
          class="rounded px-3 py-1.5 hover:bg-slate-200"
          >Profile</a
        >
      </nav>
      <div class="ml-auto flex items-center gap-3 text-sm">
        @if (auth.currentUser(); as user) {
          <span class="text-slate-600">
            {{ user.username }}
            <span class="ml-1 rounded bg-slate-200 px-1.5 py-0.5 text-xs font-medium">{{
              user.role
            }}</span>
          </span>
          <button
            type="button"
            (click)="logout()"
            class="rounded border border-slate-300 px-3 py-1.5 hover:bg-slate-100"
          >
            Log out
          </button>
        }
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-6">
    <router-outlet />
  </main>
</div>
