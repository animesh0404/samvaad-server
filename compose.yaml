# Samvaad deployment stack (ADR 0012): containerized application plus
# Compose-managed PostgreSQL. The development database in
# server/compose.yaml is a separate, unrelated stack: this file pins an
# explicit project name so the two stacks never share a network or volumes.
name: samvaad

services:
  app:
    image: animesh0404/samvaad-server:0.0.1
    container_name: samvaad-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/samvaad
      SPRING_DATASOURCE_USERNAME: samvaad
      # Deployment database password comes from .env so the application and
      # PostgreSQL always share the same generated secret. :? fails fast with
      # a clear message when the variable is missing instead of booting with
      # an empty password.
      SPRING_DATASOURCE_PASSWORD: ${SAMVAAD_DB_PASSWORD:?SAMVAAD_DB_PASSWORD is not set. Add it to .env (see scripts/install.sh).}
      # External operator configuration (ADR 0017): application.yaml lives
      # next to this file (repo root for start.sh, ~/.samvaad for the
      # installer) and is mounted into the container; the application
      # populates it with defaults only when it is missing or empty and
      # never modifies existing content. TLS identity lives in the
      # dedicated samvaad-tls volume, never in the image or the database
      # volume.
      SAMVAAD_CONFIG_DIR: /config
      SAMVAAD_TLS_DIR: /tls
    volumes:
      - ./application.yaml:/config/application.yaml
      - samvaad-tls:/tls
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: samvaad-db
    environment:
      POSTGRES_DB: samvaad
      POSTGRES_USER: samvaad
      POSTGRES_PASSWORD: ${SAMVAAD_DB_PASSWORD:?SAMVAAD_DB_PASSWORD is not set. Add it to .env (see scripts/install.sh).}
    volumes:
      - samvaad-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samvaad -d samvaad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  samvaad-data:
  samvaad-tls:
